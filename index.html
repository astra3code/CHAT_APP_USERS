<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF STATUS VIEWS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  /* ============ RESET ============ */
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ============ BOOT LOADER ============ */
  #bootLoader {
    position: fixed;
    inset: 0;
    background: #e6eaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    z-index: 99999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #bootLoader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* ------ ✨ NEW CSS LOADING ANIMATION (3 dots) ------ */
  #bootLoader .loader {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    height: 5rem;
    min-width: 12rem;
    position: relative;
  }
  #bootLoader .loader::before {
    content: '';
    position: absolute;
    inset: -0.8rem;
    border-radius: 4rem;
    background: radial-gradient(circle at 30% 30%, rgba(120, 160, 255, 0.1), transparent 70%);
    filter: blur(8px);
    z-index: -1;
    animation: pulse-glow 2.5s infinite alternate;
  }
  @keyframes pulse-glow {
    0%   { opacity: 0.4; transform: scale(0.9); }
    100% { opacity: 0.9; transform: scale(1.2); }
  }
  #bootLoader .dot {
    width: 1.2rem;
    height: 1.2rem;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    animation: bounce 1.4s infinite ease-in-out both;
    will-change: transform, opacity;
  }
  #bootLoader .dot:nth-child(1) {
    background: #7aa9ff;
    box-shadow: 0 0 16px #3d7eff;
    animation-delay: -0.32s;
  }
  #bootLoader .dot:nth-child(2) {
    background: #e0aaff;
    box-shadow: 0 0 16px #b86bff;
    animation-delay: -0.16s;
  }
  #bootLoader .dot:nth-child(3) {
    background: #a0f0ff;
    box-shadow: 0 0 16px #48d6ff;
    animation-delay: 0s;
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.7) translateY(0); opacity: 0.5; }
    40%           { transform: scale(1.1) translateY(-1rem); opacity: 1; }
  }

  /* ------ boot text (kept original) ------ */
  #bootLoader .boot-text {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6b7789;
    animation: bootFade 1.6s ease-in-out infinite;
  }
  @keyframes bootFade {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  :root {
    --bg:          #e6eaf0;
    --bg-soft:     #eef1f6;
    --bg-card:     #e6eaf0;
    --text:        #2c3444;
    --text-soft:   #6b7789;
    --text-mute:   #98a3b4;
    --accent:      #d4a017;
    --accent-soft: #f0c952;
    --accent-deep: #a87c0e;
    --shadow-dark: #c4cad4;
    --shadow-lite: #ffffff;
    --success:     #16a34a;
    --error:       #dc2626;
    --info:        #2563eb;
    --radius-lg:   20px;
    --radius-md:   14px;
    --radius-sm:   10px;
    --radius-pill: 999px;
    --font:        'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ MAIN SHELL ============ */
  .shell {
    width: 100%;
    max-width: 460px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 1.75rem 1.5rem;
    box-shadow:
      14px 14px 28px var(--shadow-dark),
      -14px -14px 28px var(--shadow-lite);
  }

  /* ============ HEADER ============ */
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .brand-logo {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-md);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    box-shadow:
      4px 4px 10px var(--shadow-dark),
      -4px -4px 10px var(--shadow-lite);
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--text);
    line-height: 1.1;
  }
  .brand-text p {
    font-size: 0.7rem;
    color: var(--text-soft);
    font-weight: 500;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }

  /* ============ STATS BAR ============ */
  .stats {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 0.75rem;
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    margin-bottom: 0.85rem;
    box-shadow:
      inset 2px 2px 5px rgba(180, 187, 199, 0.55),
      inset -2px -2px 5px rgba(255, 255, 255, 0.95);
  }
  .stats-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    text-transform: uppercase;
  }
  .stats-label-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(22,163,74,0.18);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(22,163,74,0.18); }
    50%      { box-shadow: 0 0 0 5px rgba(22,163,74,0.06); }
  }
  .stats-count {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stats-count span {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-mute);
  }

  /* ============ PROGRESS ============ */
  .progress-wrap {
    height: 8px;
    background: var(--bg-soft);
    border-radius: var(--radius-pill);
    margin-bottom: 1.5rem;
    overflow: hidden;
    box-shadow:
      inset 2px 2px 4px rgba(180, 187, 199, 0.5),
      inset -2px -2px 4px rgba(255, 255, 255, 0.9);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-soft));
    border-radius: var(--radius-pill);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(212,160,23,0.35);
  }

  /* ============ FORM ============ */
  .field {
    margin-bottom: 1.1rem;
  }
  .field label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-soft);
    margin-bottom: 0.5rem;
    padding-left: 0.35rem;
  }
  .field-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field-icon {
    position: absolute;
    left: 1rem;
    font-size: 1.1rem;
    pointer-events: none;
    opacity: 0.65;
    transition: opacity 0.2s;
  }
  .field input {
    width: 100%;
    padding: 0.85rem 1rem 0.85rem 2.75rem;
    font-size: 0.95rem;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text);
    background: var(--bg-soft);
    border: none;
    border-radius: var(--radius-md);
    outline: none;
    box-shadow:
      inset 2px 2px 5px rgba(180, 187, 199, 0.55),
      inset -2px -2px 5px rgba(255, 255, 255, 0.95);
    transition: box-shadow 0.2s;
  }
  .field input::placeholder {
    color: var(--text-mute);
    font-weight: 400;
  }
  .field input:focus {
    box-shadow:
      inset 2px 2px 5px rgba(180, 187, 199, 0.55),
      inset -2px -2px 5px rgba(255, 255, 255, 0.95),
      0 0 0 2px var(--accent-soft);
  }
  .field-input-wrap:focus-within .field-icon { opacity: 1; }
  .field-hint {
    font-size: 0.7rem;
    color: var(--text-mute);
    margin-top: 0.4rem;
    padding-left: 0.35rem;
    font-weight: 500;
  }
  .field-hint.warn { color: var(--error); }

  /* invisible honeypot for bots */
  .honeypot {
    position: absolute;
    left: -9999px;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ============ SUBMIT BUTTON ============ */
  .btn-submit {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent), var(--accent-soft));
    color: #fff;
    font-family: var(--font);
    font-size: 0.92rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      4px 4px 9px rgba(180, 187, 199, 0.6),
      -4px -4px 9px rgba(255, 255, 255, 0.95),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition: all 0.15s;
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-submit:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow:
      5px 5px 11px rgba(180, 187, 199, 0.6),
      -5px -5px 11px rgba(255, 255, 255, 0.95),
      inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn-submit:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow:
      inset 3px 3px 6px rgba(0,0,0,0.18),
      inset -3px -3px 6px rgba(255,255,255,0.2);
  }
  .btn-submit:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }

  /* ============ STATUS ============ */
  .status {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    font-weight: 600;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    background: var(--bg-soft);
    color: var(--text-soft);
    box-shadow:
      inset 2px 2px 4px rgba(180, 187, 199, 0.5),
      inset -2px -2px 4px rgba(255, 255, 255, 0.9);
    min-height: 2.75rem;
    transition: all 0.3s;
  }
  .status.info    { color: var(--info); }
  .status.success { color: var(--success); }
  .status.error   { color: var(--error); }
  .status.warn    { color: var(--accent-deep); }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ============ DOWNLOAD ============ */
  .btn-download {
    width: 100%;
    padding: 0.95rem;
    border: none;
    border-radius: var(--radius-md);
    background: var(--bg-soft);
    color: var(--accent-deep);
    font-family: var(--font);
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      4px 4px 9px rgba(180, 187, 199, 0.6),
      -4px -4px 9px rgba(255, 255, 255, 0.95);
    transition: all 0.15s;
    margin-top: 0.85rem;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-download:hover {
    color: var(--accent);
    transform: translateY(-1px);
  }
  .btn-download:active {
    box-shadow:
      inset 3px 3px 6px rgba(180, 187, 199, 0.55),
      inset -3px -3px 6px rgba(255, 255, 255, 0.95);
    transform: translateY(1px);
  }

  /* ============ FOOTER ============ */
  .footer {
    margin-top: 1.35rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-mute);
    letter-spacing: 0.02em;
  }
  .footer span {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  /* ============ COOLDOWN BANNER ============ */
  .cooldown-banner {
    display: none;
    background: var(--bg-soft);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    margin-top: 0.85rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent-deep);
    text-align: center;
    box-shadow:
      inset 2px 2px 4px rgba(180, 187, 199, 0.5),
      inset -2px -2px 4px rgba(255, 255, 255, 0.9);
  }
  .cooldown-banner.active { display: block; }
  .cooldown-banner .timer {
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-weight: 800;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 480px) {
    body { padding: 0.75rem; }
    .shell { padding: 1.5rem 1.25rem; border-radius: 18px; }
    .stats-count { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<!-- 🎬 BOOT LOADER -->
<div id="bootLoader">
  <div class="loader" aria-label="loading animation" role="status">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="boot-text">Loading…</div>
</div>

<div class="shell">

  <!-- BRAND HEADER -->
  <div class="brand">
    <div class="brand-logo">🐺</div>
    <div class="brand-text">
      <h1>WOLF COMMUNITY</h1>
      <p>WHATSAPP VIEWS FILE</p>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats">
    <div class="stats-label">
      <span class="stats-label-dot"></span>
      Registered
    </div>
    <div class="stats-count">
      <span id="countNow">0</span><span>/500</span>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- FORM -->
  <form id="vcfForm" novalidate>

    <!-- 🍯 honeypot: invisible to humans, catches bots -->
    <input type="text" name="website" id="honeypot" class="honeypot"
           tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="fullName">Full Name</label>
      <div class="field-input-wrap">
        <span class="field-icon">👤</span>
        <input type="text" id="fullName" placeholder="Majina Yako Mawili"
               required maxlength="80" autocomplete="name">
      </div>
    </div>

    <div class="field">
      <label for="phoneNumber">WhatsApp Number</label>
      <div class="field-input-wrap">
        <span class="field-icon">📞</span>
        <input type="tel" id="phoneNumber" placeholder="255 x x x x x x x"
               required autocomplete="tel">
      </div>
      <div class="field-hint" id="phoneHint">include country code (mfano; 255655233684)</div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <span></span> Save Contact
    </button>

    <div class="cooldown-banner" id="cooldownBanner">
      ⏳ Please wait <span class="timer" id="cooldownTimer">5:00</span> before registering another number
    </div>

  </form>

  <!-- STATUS -->
  <div class="status info" id="statusMsg">
    <span class="status-dot"></span>
    <span id="statusText">Connecting to database…</span>
  </div>

  <!-- DOWNLOAD -->
  <button class="btn-download" id="downloadBtn">
    <span>📥</span> Download VCF File
  </button>

  <!-- FOOTER -->
  <div class="footer">
    <span>Auto-saved</span>
    <span>500 max</span>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy,
         serverTimestamp, where, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

// ==========================================
// 🔥 YOUR FIREBASE CONFIG
//===========================================
const firebaseConfig = {
  apiKey: "AIzaSyAT7kHenXqzm9l9CnpTJiqro_uk09FKJpA",
  authDomain: "wolf-vcf.firebaseapp.com",
  projectId: "wolf-vcf",
  storageBucket: "wolf-vcf.firebasestorage.app",
  messagingSenderId: "968984690207",
  appId: "1:968984690207:web:99ddac7e933dfd79bc5f2a"
};
// ===========================================

const MAX_CONTACTS = 500;
const COOLDOWN_MS  = 5 * 60 * 1000;
const COOLDOWN_KEY = 'wolf_last_submit';
const PHONES_KEY   = 'wolf_my_phones';

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const form           = document.getElementById('vcfForm');
const fullNameInput  = document.getElementById('fullName');
const phoneInput     = document.getElementById('phoneNumber');
const honeypot       = document.getElementById('honeypot');
const countNow       = document.getElementById('countNow');
const progressFill   = document.getElementById('progressFill');
const statusMsg      = document.getElementById('statusMsg');
const statusText     = document.getElementById('statusText');
const submitBtn      = document.getElementById('submitBtn');
const downloadBtn    = document.getElementById('downloadBtn');
const phoneHint      = document.getElementById('phoneHint');
const cooldownBanner = document.getElementById('cooldownBanner');
const cooldownTimer  = document.getElementById('cooldownTimer');

let contacts = [];
let unsubscribe = null;
let cooldownInterval = null;
const DEFAULT_BTN_LABEL = '<span></span> Save Contact';

// ---------- HELPERS ----------
function setStatus(text, type = 'info') {
  statusText.textContent = text;
  statusMsg.className = 'status ' + type;
}

function normalizePhone(raw) {
  let p = raw.trim().replace(/[\s\-\(\)\.]/g, '');
  if (!p.startsWith('+')) p = '+' + p.replace(/\D/g, '');
  else p = '+' + p.slice(1).replace(/\D/g, '');
  return p;
}

function isValidPhone(p) {
  const digits = p.replace(/\D/g, '');
  return digits.length >= 7 && digits.length <= 15;
}

// ---------- ANTI-SPAM HELPERS ----------
function getLastSubmitTime() {
  const stored = localStorage.getItem(COOLDOWN_KEY);
  return stored ? parseInt(stored, 10) : 0;
}
function setLastSubmitTime() {
  localStorage.setItem(COOLDOWN_KEY, Date.now().toString());
}
function getMyPhones() {
  try { return JSON.parse(localStorage.getItem(PHONES_KEY) || '[]'); }
  catch { return []; }
}
function addMyPhone(phone) {
  const phones = getMyPhones();
  if (!phones.includes(phone)) {
    phones.push(phone);
    localStorage.setItem(PHONES_KEY, JSON.stringify(phones));
  }
}
function isPhoneRegisteredFromThisDevice(phone) {
  return getMyPhones().includes(phone);
}
function getCooldownRemaining() {
  const last = getLastSubmitTime();
  if (!last) return 0;
  return Math.max(0, COOLDOWN_MS - (Date.now() - last));
}
function formatCooldown(ms) {
  const totalSec = Math.ceil(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function updateCooldownUI() {
  const remaining = getCooldownRemaining();
  if (remaining > 0) {
    cooldownBanner.classList.add('active');
    cooldownTimer.textContent = formatCooldown(remaining);
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>⏳</span> Cooldown active';
    if (!cooldownInterval) {
      cooldownInterval = setInterval(() => {
        const r = getCooldownRemaining();
        if (r <= 0) {
          clearInterval(cooldownInterval);
          cooldownInterval = null;
          cooldownBanner.classList.remove('active');
          if (contacts.length < MAX_CONTACTS) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = DEFAULT_BTN_LABEL;
          }
        } else {
          cooldownTimer.textContent = formatCooldown(r);
        }
      }, 1000);
    }
  } else {
    cooldownBanner.classList.remove('active');
    if (cooldownInterval) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
    }
    if (contacts.length < MAX_CONTACTS) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = DEFAULT_BTN_LABEL;
    }
  }
}

// ---------- VCF GENERATION ----------
function escapeVcf(s) {
  return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
          .replace(/\n/g, '\\n');
}

function buildVcf(list) {
  if (!list.length) return '';
  return list.map(c =>
    `BEGIN:VCARD\nVERSION:3.0\nFN:${escapeVcf(c.name)}\nTEL;TYPE=CELL:${c.phone}\nEND:VCARD`
  ).join('\n\n') + '\n';
}

// ---------- SERVER DUPLICATE CHECK ----------
async function phoneExistsInFirestore(phone) {
  try {
    const q = query(collection(db, 'contacts'), where('phone', '==', phone));
    const snap = await getDocs(q);
    return !snap.empty;
  } catch (err) {
    console.warn('Duplicate check failed:', err);
    return false;
  }
}

// ---------- REAL-TIME LISTENER ----------
function listenToContacts() {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, 'contacts'), orderBy('createdAt', 'asc'));
  unsubscribe = onSnapshot(q,
    (snapshot) => {
      contacts = snapshot.docs.map(d => ({
        id: d.id,
        name: d.data().name,
        phone: d.data().phone
      }));

      const count = contacts.length;
      const pct = Math.min((count / MAX_CONTACTS) * 100, 100);
      countNow.textContent = count;
      progressFill.style.width = pct + '%';

      if (count >= MAX_CONTACTS) {
        submitBtn.disabled = true;
        downloadBtn.style.display = 'flex';
        setStatus(`🎯 Target reached! ${count}/${MAX_CONTACTS} — download below.`, 'info');
      } else {
        downloadBtn.style.display = 'none';
        if (getCooldownRemaining() <= 0) {
          submitBtn.disabled = false;
          setStatus(`${count}/${MAX_CONTACTS} contacts registered.`, 'info');
        }
      }
    },
    (err) => {
      console.error('Firestore listener error:', err);
      if (err.code === 'permission-denied') {
        setStatus('⚠️ Permission denied. Publish Firestore rules.', 'error');
      } else {
        setStatus('⚠️ Firebase error: ' + err.message, 'error');
      }
    }
  );
}

// ---------- SUBMIT ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  // 🍯 Layer 1: honeypot
  if (honeypot.value.trim() !== '') {
    console.warn('Honeypot triggered — likely bot.');
    setStatus('🚫 Registration blocked.', 'error');
    return;
  }

  // Layer 2: limit
  if (contacts.length >= MAX_CONTACTS) {
    setStatus('⛔ Limit reached (500). Download the file.', 'error');
    return;
  }

  // ⏳ Layer 3: cooldown
  const remaining = getCooldownRemaining();
  if (remaining > 0) {
    setStatus(`⏳ Please wait ${formatCooldown(remaining)} before next registration.`, 'warn');
    return;
  }

  const name = fullNameInput.value.trim();
  const rawPhone = phoneInput.value.trim();

  if (name.length < 2) return setStatus('❌ Enter a valid name (min 2 chars).', 'error');
  const phone = normalizePhone(rawPhone);
  if (!isValidPhone(phone)) {
    phoneHint.classList.add('warn');
    phoneHint.textContent = 'Must include country code and 7–15 digits';
    return setStatus('❌ Invalid phone. Use +255712345678.', 'error');
  }

  // 🚫 Layer 4: same-device duplicate
  if (isPhoneRegisteredFromThisDevice(phone)) {
    return setStatus('🚫 This number is already registered from this device.', 'error');
  }

  // 🔍 Layer 5: server-side duplicate check
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span>⏳</span> Checking…';

  const exists = await phoneExistsInFirestore(phone);
  if (exists) {
    submitBtn.disabled = false;
    submitBtn.innerHTML = DEFAULT_BTN_LABEL;
    return setStatus('🚫 This number is already registered.', 'error');
  }

  submitBtn.innerHTML = '<span>⏳</span> Saving…';

  try {
    await addDoc(collection(db, 'contacts'), {
      name,
      phone,
      createdAt: serverTimestamp()
    });

    setLastSubmitTime();
    addMyPhone(phone);

    setStatus(`"${name}" added!`, 'success');
    fullNameInput.value = '';
    phoneInput.value = '';
    phoneHint.classList.remove('warn');
    phoneHint.textContent = 'Include country code (e.g. +255)';
    fullNameInput.focus();

    updateCooldownUI();

  } catch (err) {
    console.error('Save error:', err);
    submitBtn.disabled = false;
    submitBtn.innerHTML = DEFAULT_BTN_LABEL;

    if (err.code === 'permission-denied') {
      setStatus('❌ Permission denied. Publish your Firestore rules.', 'error');
    } else {
      setStatus('❌ Save failed: ' + err.message, 'error');
    }
  }
});

// ---------- DOWNLOAD ----------
downloadBtn.addEventListener('click', () => {
  const vcf = buildVcf(contacts);
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wolf_contacts_${contacts.length}.vcf`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus(`📥 Downloaded ${contacts.length} contacts.`, 'info');
});

// ---------- START ----------
listenToContacts();
updateCooldownUI();
</script>

<!-- 🎬 BOOT LOADER SCRIPT (CSS-only) -->
<script>
  const bootLoader = document.getElementById('bootLoader');

  function hideBootLoader() {
    if (!bootLoader) return;
    bootLoader.classList.add('hide');
    setTimeout(() => bootLoader.remove(), 600);
  }

  // Hide after 2.5 seconds (or when the page fully loads)
  const bootTimeout = setTimeout(hideBootLoader, 3500);
  window.addEventListener('load', () => {
    clearTimeout(bootTimeout);
    // Small extra delay so the animation is visible
    setTimeout(hideBootLoader, 3500);
  });
</script>
